name: Flight price tracker (Goa -> Mumbai)

# Runs the tracker on a schedule and commits the updated price history back to
# the repo, so you get a running log of prices over time. Alerts fire from
# inside flight_tracker.py (email / webhook) when the price drops.
#
# Set repository Secrets (Settings -> Secrets and variables -> Actions) to use
# real data + alerts:
#   FLIGHT_PROVIDER        -> "amadeus"  (defaults to "mock" if unset)
#   AMADEUS_CLIENT_ID      -> from developers.amadeus.com
#   AMADEUS_CLIENT_SECRET
#   ALERT_WEBHOOK_URL      -> optional Slack/Discord incoming webhook
#   SMTP_HOST / SMTP_USER / SMTP_PASSWORD / ALERT_TO -> optional email alerts

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC). Tighten/loosen as you like.
  workflow_dispatch: {}      # lets you run it on demand from the Actions tab

permissions:
  contents: write            # to commit price_history.json back

concurrency:
  group: flight-price-tracker
  cancel-in-progress: false

jobs:
  check-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check fares
        env:
          FLIGHT_PROVIDER: ${{ secrets.FLIGHT_PROVIDER }}
          AMADEUS_CLIENT_ID: ${{ secrets.AMADEUS_CLIENT_ID }}
          AMADEUS_CLIENT_SECRET: ${{ secrets.AMADEUS_CLIENT_SECRET }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python flight_tracker.py

      - name: Commit updated price history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update flight price history [skip ci]"
            git push
          else
            echo "No price-history change to commit."
          fi
